name: Publish

on:
  push:
    branches: [main, nabeel-changes]
    tags: ["v*"]

env:
  CI: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_KEYGEN_API_URL=${{ secrets.NEXT_PUBLIC_KEYGEN_API_URL }}
            NEXT_PUBLIC_KEYGEN_SINGLEPLAYER=${{ secrets.NEXT_PUBLIC_KEYGEN_SINGLEPLAYER }}
            NEXT_PUBLIC_KEYGEN_ACCOUNT_ID=${{ secrets.NEXT_PUBLIC_KEYGEN_ACCOUNT_ID }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/vacentral/keygen-ui:latest
            ${{ secrets.REGISTRY_URL }}/vacentral/keygen-ui:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
